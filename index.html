<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Annem Büyüyünce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4D77A;--paper:#FFF9EE;--ink:#1F2A5A;--pink:#F28AC9;--pinkd:#c94f97;--green:#8CC63F;--muted:#5b6386;--night:#141a3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--bg);transition:background .8s,color .8s;user-select:none;-webkit-user-select:none}
body.night{background:var(--night);color:#ecebff}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0 0 .35em;line-height:1.12}
p{line-height:1.55;margin:.45em 0}
#stage{position:fixed;inset:0;overflow-y:auto;display:flex;justify-content:center}
.screen{width:100%;max-width:480px;padding:48px 16px 36px;display:flex;flex-direction:column;align-items:center;text-align:center;animation:enter .5s ease}
.screen>:first-child{margin-top:auto}.screen>:last-child{margin-bottom:auto}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kicker{font-weight:800;letter-spacing:.1em;font-size:13px;opacity:.7;margin:0 0 6px}
.muted{opacity:.75;font-size:15px}
.card{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:22px;padding:18px;width:100%;box-shadow:5px 5px 0 var(--ink);text-align:left}
.btn{font:800 17px Nunito,sans-serif;background:var(--pink);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:12px 26px;margin-top:16px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--paper)}
.btn:disabled{opacity:.4}
body.night .btn{box-shadow:4px 4px 0 #000}
.stripes{height:10px;border-radius:6px;margin:8px 0 12px;background:repeating-linear-gradient(90deg,var(--pink) 0 12px,var(--green) 12px 17px)}

/* Konuşma */
.talk{display:flex;flex-direction:column;align-items:center;width:100%}
.talk .who-art{height:170px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:-6px}
.talk .who-art svg{height:100%;width:auto}
.bubble{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:22px;padding:14px 18px;text-align:left;box-shadow:4px 4px 0 var(--ink);width:100%;min-height:96px;font-size:17px}
.bubble .who{display:block;font-weight:800;color:var(--pinkd);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.bubble.narr{font-family:Fraunces,serif;font-style:italic;font-size:18px;background:transparent;color:inherit;border:none;box-shadow:none;text-align:center}
.tap{font-size:13px;opacity:.6;margin-top:10px}

/* Tasarım ekranı */
.preview{width:min(68vw,250px);aspect-ratio:1;background:var(--paper);border:3px solid var(--ink);border-radius:26px;box-shadow:5px 5px 0 var(--ink);margin:10px 0 12px;padding:10px}
.preview svg{width:100%;height:100%;display:block}
.row{width:100%;margin:6px 0;text-align:left}
.rl{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:5px}
.op{font:700 14px Nunito;border:2px solid var(--ink);border-radius:999px;padding:6px 12px;background:var(--paper);color:var(--ink);cursor:pointer}
.op.sel{background:var(--ink);color:var(--paper)}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);cursor:pointer;padding:0}
.sw.sel{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink)}

/* Ev */
.room{width:100%;border:3px solid var(--ink);border-radius:22px;overflow:hidden;box-shadow:5px 5px 0 var(--ink);background:#F7EFE2;margin:6px 0 12px}
.room svg{display:block;width:100%;height:auto}
.list{display:flex;flex-direction:column;gap:9px;width:100%}
.stop{display:flex;align-items:center;gap:12px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:10px 14px;text-align:left;font-weight:800;cursor:pointer;box-shadow:3px 3px 0 var(--ink);color:var(--ink);font-family:Nunito;font-size:16px}
.stop small{display:block;font-weight:400;opacity:.75;font-size:13px}
.stop .n{font-family:Fraunces,serif;font-size:22px;width:30px}
.stop.done{background:#e3f1cf}
.stop.locked{opacity:.45;cursor:default}
.stop.next{animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.025)}}
.reset{background:none;border:none;color:inherit;opacity:.4;font:13px Nunito;margin-top:18px;cursor:pointer}

/* Hat dengeleme */
.task{display:flex;justify-content:space-between;align-items:center;width:100%;padding:8px 12px;border:2px solid var(--ink);border-radius:12px;font-weight:700;font-size:15px}
.task i{font-style:normal;font-weight:800}
.gap{width:100%;height:24px;border:none;background:none;cursor:pointer;position:relative;color:var(--ink);font:700 11px Nunito;opacity:.5}
.gap.cut{opacity:1}
.gap.cut::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:3px dashed var(--pinkd)}
.gap span{position:relative;background:var(--bg);padding:0 8px}
.bars{width:100%;margin:12px 0 4px}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-weight:800;font-size:13px}
.bar .tr{flex:1;height:16px;border:2px solid var(--ink);border-radius:8px;position:relative;background:var(--paper);overflow:hidden}
.bar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--green)}
.bar .tr i.over{background:#e9765b}
.bar .tr .tgt{position:absolute;top:-2px;bottom:-2px;border-left:2px solid var(--ink)}
.st0{background:#FCE3F1}.st1{background:#E3F1CF}.st2{background:#DCE6FB}

/* Kelime, matris */
.words{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin:10px 0}
.word{font:800 15px Nunito;padding:14px 4px;border:2px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);cursor:pointer}
.word.sel{background:var(--pink)}
.mrow{display:flex;justify-content:space-between;align-items:center;margin:7px 0;gap:8px}
.mrow span{font-weight:700;font-size:15px}
.dots{display:flex;gap:5px;flex-shrink:0}
.dots button{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);padding:0;cursor:pointer}
.dots button.on{background:var(--pink)}
.mcard{margin-bottom:12px}
.mcard h3{font-size:20px}
.res{width:100%;margin:8px 0}
.res .bar .tr i{background:var(--pink)}

/* Nefes */
.breath{width:220px;height:220px;border-radius:50%;margin:18px auto;position:relative;touch-action:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.breath .ring{position:absolute;inset:0;border-radius:50%;border:3px solid #ecebff55}
.breath .orb{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe9b0,#f2a65a 60%,#c96a3a);transform:scale(.35);box-shadow:0 0 60px #f2a65a88}
.breath .lbl{position:absolute;font-weight:800;color:#1b1f3a;font-size:16px;pointer-events:none}
.memory{min-height:90px;font-family:Fraunces,serif;font-style:italic;font-size:18px;max-width:380px}

/* Takvim, hediye */
.cal{width:130px;margin:0 auto 14px;background:var(--paper);border:4px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;color:var(--ink)}
.cal .mo{background:var(--pink);border-bottom:4px solid var(--ink);font-weight:800;letter-spacing:3px;padding:6px 0}
.cal .day{font-family:Fraunces,serif;font-weight:800;font-size:70px;line-height:1.15}
.cal .day.turn{animation:turn .9s ease}
@keyframes turn{50%{transform:rotateX(90deg);opacity:.2}}
.gift{font-size:110px;cursor:pointer;display:inline-block;filter:drop-shadow(5px 5px 0 var(--ink))}
.gift.shake{animation:shake .5s}
@keyframes shake{20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
.letter p{font-size:16px}
#back{position:fixed;top:10px;left:10px;z-index:25;font:800 14px Nunito;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;opacity:.85}
#back[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#F4D77A;padding:10px 18px;border-radius:999px;font-weight:800;opacity:0;transition:opacity .3s;z-index:30;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
</style>
</head>

<script>
/* =====================================================================
   CONFIG — kişiselleştirmek için burayı düzenle
   ===================================================================== */
const CONFIG = {
  name: "Merve",
  from: "Emre",
  girl: "Ela",
  boy: "Marsel",
  // Oyunun sonunda açılan hediye. Gerçekte vereceğin hediyeyle aynı olmalı.
  gift: {
    title: "Senin masan",
    text: "Bu evi kurarken bir şey eksikti: sana ait bir yer. Artık var. Masanın üstünde beğendiğin o pileli lamba. Nereye taşınırsak taşınalım, İstanbul, Ankara, belki bir gün Londra, masan da ışığın da seninle gelecek. Yanında bir seramik atölyesi kaydı: oyunda tasarladığın tabağı bu kez kendi ellerinle yapacaksın.",
    image: "",             // örn. "img/hediye.jpg"
    lampColor: "#F4F0E8",  // KUDDLAVA: beyaz pileli abajur
    finalLine: "Şimdi başını kaldır 💛",
  },
  letter: [
    "Sevgilim {name},",
    "Son yıllarda çok yol değiştirdin. Kurumsal, kendi markan, iki bebek, Ankara, İstanbul, yine Ankara, yine İstanbul... Bazen bunları yarım kalmış şeyler gibi görüyorsun, biliyorum.",
    "Ben öyle görmüyorum. Bir mühendisin, bir girişimcinin ve bir annenin aynı insanda nasıl yan yana durduğunu gördüm. {girl} ve {boy} büyürken onların yanında olmayı seçtin. Kolay değildi ve sen geri adım atmadın.",
    "Şimdi kafan karışık, bu çok normal. Cevabı bu gece bulmak zorunda değilsin. Ama bu evi nasıl kurduğunu gördün: zevkle, akılla, sabırla. Hayatını da öyle kuracaksın. Hangi kapıdan geçersen geç, yanında olacağım.",
    "İyi ki doğdun. İyi ki benimlesin.",
    "{from}",
  ],
};

/* ===================================================================== */
const $ = s => document.querySelector(s);
const stage = $("#stage");

/* ---------- Geri gitme ----------
   Her ekran at() ile kendini kaydeder. Oyundaki "geri" butonu da,
   telefonun geri tuşu/kaydırması da bir önceki ekrana döner; oyundan çıkmaz. */
const HIST = [];
let current = null, restoring = false;
function at(fn){
  if (restoring){ current = {fn}; return; }
  if (current) HIST.push(current);
  current = {fn};
  history.pushState({n: HIST.length}, "");
  $("#back").hidden = !HIST.length;
}
function goBack(){
  if (!HIST.length) return;
  const prev = HIST.pop();
  restoring = true; current = null;
  night(!!prev.night);
  try { prev.fn(); } finally { restoring = false; }
  $("#back").hidden = !HIST.length;
}
addEventListener("popstate", () => {
  if (HIST.length) goBack();
  else history.pushState({n: 0}, "");  // ilk ekranda geri basılırsa sayfadan çıkmasın
});
function toast(msg, ms = 2200){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), ms); }
function night(on){ document.body.classList.toggle("night", on); }
function chr(w, h){ const [vw, vh] = VB[w]; return `<svg style="height:${h}px;width:${h*vw/vh}px" viewBox="0 0 ${vw} ${vh}"><use href="#c-${w}"/></svg>`; }
function mix(a, b, t){ const p = h => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16)); const A = p(a), B = p(b); return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join(""); }
function lum(h){ const [r,g,b] = [1,3,5].map(i => parseInt(h.slice(i, i+2), 16) / 255); return .3*r + .59*g + .11*b; }

    <div class="tap">dokun →</div></div>`);

/* ---------- Nesneler (hepsi 100x100 kutuda çizilir) ---------- */
let uid = 0;
function ringPath(cx, cy, r, rim){
  let s = "";
  for (let i = 0; i <= 144; i++){
    const a = i / 144 * Math.PI * 2;
    let rr = r;
    if (rim === "wavy") rr = r + 1.6 * Math.sin(a * 14);
    if (rim === "scallop") rr = r - 3 + 3 * Math.abs(Math.sin(a * 9));
    s += (i ? "L" : "M") + (cx + rr * Math.cos(a)).toFixed(2) + " " + (cy + rr * Math.sin(a)).toFixed(2);
  }
  return s + "Z";
}
function plateSVG(d){
  const c = d.color, t = mix(c, "#ffffff", .55), id = "p" + (uid++);
  let pat = "", rimFill = c, extra = "";
  if (d.pattern === "check"){
    pat = `<pattern id="${id}" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="${c}"/><rect width="3.5" height="3.5" fill="#fff" opacity=".6"/><rect x="3.5" y="3.5" width="3.5" height="3.5" fill="#fff" opacity=".6"/></pattern>`;
    rimFill = `url(#${id})`;
  }
  if (d.pattern === "stripe") for (let i = 0; i < 40; i++){ const a = i / 40 * Math.PI * 2; extra += `<line x1="${50+31*Math.cos(a)}" y1="${50+31*Math.sin(a)}" x2="${50+40*Math.cos(a)}" y2="${50+40*Math.sin(a)}" stroke="#fff" stroke-opacity=".7" stroke-width="1.6"/>`; }
  if (d.pattern === "dots") for (let i = 0; i < 16; i++){ const a = i / 16 * Math.PI * 2; extra += `<circle cx="${50+36*Math.cos(a)}" cy="${50+36*Math.sin(a)}" r="2" fill="#fff" opacity=".85"/>`; }
  return `<defs>${pat}</defs><path d="${ringPath(51.5, 52.5, 43, d.rim)}" fill="#000" opacity=".12"/>
    <path d="${ringPath(50, 50, 43, d.rim)}" fill="${rimFill}" stroke="${mix(c, "#000000", .25)}" stroke-width="1"/>${extra}
    <circle cx="50" cy="50" r="29" fill="${t}" stroke="${mix(c, "#000000", .15)}" stroke-opacity=".4" stroke-width=".8"/>
    <ellipse cx="40" cy="38" rx="10" ry="4.5" fill="#fff" opacity=".3" transform="rotate(-30 40 38)"/>`;
}
function clockSVG(d){
  const c = d.color, dk = lum(c) < .5 ? "#ffffff" : "#1F2A5A", id = "c" + (uid++);
  let shape, cx = 50, cy = 50;
  if (d.shape === "round") shape = `<circle cx="50" cy="50" r="42"/>`;
  if (d.shape === "squircle") shape = `<rect x="9" y="9" width="82" height="82" rx="26"/>`;
  if (d.shape === "arch"){ shape = `<path d="M14 94 V44 A36 36 0 0 1 86 44 V94 Z"/>`; cy = 58; }
  let face = "", marks = "";
  if (d.face === "slices"){
    const cols = [c, mix(c, "#ffffff", .45), "#F2B8C6", "#B7C96B"], R = 70;
    face = cols.map((col, i) => { const a0 = i * Math.PI / 2 - Math.PI / 2, a1 = a0 + Math.PI / 2; return `<path d="M${cx} ${cy} L${cx+R*Math.cos(a0)} ${cy+R*Math.sin(a0)} A${R} ${R} 0 0 1 ${cx+R*Math.cos(a1)} ${cy+R*Math.sin(a1)} Z" fill="${col}"/>`; }).join("");
  }
  if (d.face === "minimal") for (let i = 0; i < 4; i++){ const a = i * Math.PI / 2; marks += `<line x1="${cx+27*Math.cos(a)}" y1="${cy+27*Math.sin(a)}" x2="${cx+34*Math.cos(a)}" y2="${cy+34*Math.sin(a)}" stroke="${dk}" stroke-width="3.5" stroke-linecap="round"/>`; }
  if (d.face === "dots") for (let i = 0; i < 12; i++){ const a = i * Math.PI / 6; marks += `<circle cx="${cx+31*Math.cos(a)}" cy="${cy+31*Math.sin(a)}" r="${i % 3 ? 1.8 : 3.2}" fill="${dk}"/>`; }
  const hc = d.face === "slices" ? "#1F2A5A" : dk;
  const hand = (deg, len, w) => { const a = (deg - 90) * Math.PI / 180; return `<line x1="${cx}" y1="${cy}" x2="${cx+len*Math.cos(a)}" y2="${cy+len*Math.sin(a)}" stroke="${hc}" stroke-width="${w}" stroke-linecap="round"/>`; };
  // ibreler 11'i 11 geçiyor: 11.11
  return `<defs><clipPath id="${id}">${shape}</clipPath></defs>
    <g transform="translate(1.5,1.5)" fill="#000" opacity=".12">${shape}</g><g fill="${c}">${shape}</g>
    <g clip-path="url(#${id})">${face}</g>${marks}${hand(335.5, 18, 3.6)}${hand(66, 28, 2.2)}
    <circle cx="${cx}" cy="${cy}" r="2.8" fill="${hc}"/><g fill="none" stroke="${mix(c, "#000000", .25)}" stroke-width="1.5">${shape}</g>`;
}
const VASE = {
  bubble:   t => t < .16 ? 8 : 8 + 27 * Math.sin(Math.PI * ((t - .16) / .84) * .94 + .06),
  cylinder: t => t < .05 ? 21 : 19,
  wavy:     t => 18 + 5 * Math.sin(t * Math.PI * 4.5),
  amphora:  t => 11 + 19 * Math.sin(Math.PI * (.12 + .88 * t)),
};
function vaseSVG(d){
  const f = VASE[d.form], c = d.color, id = "v" + (uid++), y0 = 30, h = 64;
  const L = [], R = [];
  for (let i = 0; i <= 40; i++){ const t = i / 40, y = y0 + t * h, r = f(t); L.push(`${(50-r).toFixed(2)} ${y.toFixed(2)}`); R.unshift(`${(50+r).toFixed(2)} ${y.toFixed(2)}`); }
  const p = "M" + L.join("L") + "L" + R.join("L") + "Z";
  let surf = "";
  if (d.surface === "stripes") for (let y = y0 + 4; y < y0 + h; y += 8) surf += `<rect x="0" y="${y}" width="100" height="3.5" fill="#fff" opacity=".55"/>`;
  if (d.surface === "dots") for (let y = y0 + 5, k = 0; y < y0 + h; y += 7, k++) for (let x = 12 + (k % 2) * 3.5; x < 90; x += 7) surf += `<circle cx="${x}" cy="${y}" r="1.3" fill="#fff" opacity=".75"/>`;
  if (d.surface === "gloss") surf = `<rect x="${50 - f(.55) * .6}" y="${y0 + 12}" width="4.5" height="${h * .6}" rx="2.2" fill="#fff" opacity=".5"/>`;
  let st = "";
  if (d.stems === "branch") st = `<g stroke="#5f7a4a" stroke-width="1.5" fill="none"><path d="M49 32 Q42 16 30 6"/><path d="M51 32 Q58 14 72 8"/></g>
    <g fill="#7f9a5c"><ellipse cx="34" cy="10" rx="4.5" ry="2" transform="rotate(-40 34 10)"/><ellipse cx="42" cy="20" rx="4.5" ry="2" transform="rotate(30 42 20)"/><ellipse cx="66" cy="11" rx="4.5" ry="2" transform="rotate(20 66 11)"/><ellipse cx="58" cy="21" rx="4.5" ry="2" transform="rotate(-30 58 21)"/></g>`;
  if (d.stems === "tulip") st = `<g stroke="#5f7a4a" stroke-width="1.6"><line x1="47" y1="32" x2="40" y2="12"/><line x1="53" y1="32" x2="61" y2="14"/></g>
    <g fill="#E9765B"><path d="M34 12 Q40 -2 46 12 Q40 16 34 12Z"/><path d="M55 14 Q61 0 67 14 Q61 18 55 14Z"/></g>`;
  return `<defs><clipPath id="${id}"><path d="${p}"/></clipPath></defs>${st}
    <ellipse cx="52" cy="${y0 + h + 1}" rx="22" ry="3" fill="#000" opacity=".12"/>
    <path d="${p}" fill="${c}"/><g clip-path="url(#${id})">${surf}</g>
    <path d="${p}" fill="none" stroke="${mix(c, "#000000", .25)}" stroke-width="1"/>
    <ellipse cx="50" cy="${y0}" rx="${f(0)}" ry="2" fill="${mix(c, "#000000", .3)}"/>`;
}
function candleSVG(d){
  const c = d.color, dk = mix(c, "#000000", .2), hc = mix(c, "#ffffff", .5);
  let holder = "", front = "", base = 90, body = "", top;
  if (d.holder === "ceramic"){ holder = `<ellipse cx="50" cy="92" rx="24" ry="5" fill="${hc}" stroke="${dk}" stroke-width=".8"/><rect x="37" y="84" width="26" height="8" rx="3" fill="${hc}"/>`; base = 85; }
  if (d.holder === "brass"){ holder = `<ellipse cx="50" cy="93" rx="16" ry="4" fill="#C9A14A"/><rect x="47" y="72" width="6" height="21" fill="#C9A14A"/><ellipse cx="50" cy="72" rx="12" ry="3.5" fill="#D9B45A"/>`; base = 71; }
  if (d.holder === "glass"){ front = `<path d="M33 52 L33 88 Q33 95 40 95 L60 95 Q67 95 67 88 L67 52" fill="#cfe6f0" fill-opacity=".3" stroke="#8fb3c4" stroke-width="1.2"/><ellipse cx="50" cy="52" rx="17" ry="3" fill="none" stroke="#8fb3c4" stroke-width="1.2"/>`; base = 93; }
  if (d.form === "twist"){
    for (let i = 7; i >= 0; i--) body += `<ellipse cx="${50 + (i % 2 ? 2 : -2)}" cy="${base - 4 - i * 5.2}" rx="7" ry="3.6" fill="${c}" stroke="${dk}" stroke-width=".6"/>`;
    top = base - 4 - 7 * 5.2 - 3;
  }
  if (d.form === "bubble"){
    for (let r = 2; r >= 0; r--) for (let k = 0; k < 3; k++) body += `<circle cx="${40 + k * 10}" cy="${base - 5 - r * 9}" r="5.4" fill="${c}" stroke="${dk}" stroke-width=".6"/>`;
    top = base - 28;
  }
  if (d.form === "taper"){ body = `<rect x="46" y="${base - 46}" width="8" height="46" rx="3" fill="${c}" stroke="${dk}" stroke-width=".6"/>`; top = base - 46; }
  const flame = `<line x1="50" y1="${top}" x2="50" y2="${top - 3}" stroke="#333" stroke-width="1"/>
    <circle cx="50" cy="${top - 9}" r="11" fill="url(#glow)"/><path d="M50 ${top - 15} Q55 ${top - 7} 50 ${top - 3} Q45 ${top - 7} 50 ${top - 15}Z" fill="url(#flame)"/>`;
  return holder + body + flame + front;
}

    <circle cx="50" cy="20" r="5.5" fill="#C89B6A" stroke="#9c7349" stroke-width=".8"/>`;
}

function designer(opts){
  const {kicker, title, text, key, rows, render, next} = opts;
  at(() => designer(opts));
  const d = S.d[key] ? {...S.d[key]} : Object.fromEntries(rows.map(r => [r.k, r.opts[0][0]]));
  show(`<p class="kicker">${kicker}</p><h2>${title}</h2><p class="muted">${text}</p>
    <div class="preview"><svg viewBox="0 0 100 100" id="pv"></svg></div>
    ${rows.map(r => `<div class="row"><span class="rl">${r.label}</span><div class="opts">${r.opts.map(([v, l]) => r.swatch
      ? `<button class="sw" data-k="${r.k}" data-v="${v}" style="background:${v}" aria-label="${l}"></button>`
      : `<button class="op" data-k="${r.k}" data-v="${v}">${l}</button>`).join("")}</div></div>`).join("")}
    <button class="btn" id="ok">Eve yerleştir ✓</button>`);
  const draw = () => {
    $("#pv").innerHTML = render(d);
    stage.querySelectorAll("[data-k]").forEach(b => b.classList.toggle("sel", b.dataset.v === d[b.dataset.k]));
  };
  stage.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { d[b.dataset.k] = b.dataset.v; draw(); });
  $("#ok").onclick = () => { S.d[key] = d; save(); next(); };
  draw();
}

    <p class="memory" id="mem">Basılı tutarken nefes al. Işık dolunca bırak ve ver.</p>
    <p class="muted" id="cnt">0 / 3</p>`);
  const br = $("#br"), orb = $("#orb"), lbl = $("#lbl");
  let p = 0, phase = "in", holding = false, n = 0, last = performance.now(), alive = true;
  br.onpointerdown = e => { e.preventDefault(); holding = true; };
  br.onpointerup = br.onpointerleave = br.onpointercancel = () => holding = false;
  br.oncontextmenu = e => e.preventDefault();
  const timer = setInterval(() => tick(performance.now()), 40);
  const tick = now => {
    if (!alive || !document.body.contains(br)){ clearInterval(timer); return; }
    const dt = Math.min(.5, (now - last) / 1000); last = now;
    if (phase === "in"){
      p = holding ? Math.min(1, p + dt / 3.2) : Math.max(0, p - dt / 2);
      lbl.textContent = holding ? "nefes al..." : "basılı tut";
      if (p >= 1){ phase = "full"; lbl.textContent = "şimdi bırak"; }
    } else if (phase === "full"){
      if (!holding) phase = "out";
    } else {
      p = Math.max(0, p - dt / 3);
      lbl.textContent = "nefes ver...";
      if (p <= 0){
        $("#mem").textContent = MEM[n]; n++; $("#cnt").textContent = `${n} / 3`;
        phase = "in";
        if (n === 3){
          alive = false; clearInterval(timer);
          lbl.textContent = "uyudu";

          return;

      }
    }
    orb.style.transform = `scale(${.35 + .65 * p})`;
  };
}

/* ---------- Konfeti ---------- */
const cf = $("#confetti"), cx = cf.getContext("2d"); let parts = [], cfOn = false;
function confetti(n){
  cf.width = innerWidth; cf.height = innerHeight;
  const cols = ["#F28AC9","#8CC63F","#1F2A5A","#ffffff","#E0B13A","#E9765B"];
  for (let i = 0; i < n; i++) parts.push({x: innerWidth / 2, y: innerHeight / 3, vx: (Math.random() - .5) * 14, vy: Math.random() * -12 - 3, r: Math.random() * 6 + 4, c: cols[i % cols.length], a: Math.random() * 6, life: 1});
  if (!cfOn){ cfOn = true; requestAnimationFrame(cfStep); }
}
function cfStep(){
  cx.clearRect(0, 0, cf.width, cf.height);
  for (const p of parts){ p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2; p.life -= .006;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.globalAlpha = Math.max(0, p.life); cx.fillStyle = p.c; cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); cx.restore(); }
  parts = parts.filter(p => p.life > 0 && p.y < cf.height + 20);
  if (parts.length) requestAnimationFrame(cfStep); else { cfOn = false; cx.clearRect(0, 0, cf.width, cf.height); }
}
